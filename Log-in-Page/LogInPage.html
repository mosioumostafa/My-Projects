<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/styles/LogInPage.css">
    <title>ثبت نام یا ورود</title>
</head>
<body>
    <div class="universal-container">
        <div class="form-header">
            <img style="width: 4rem ; height: 4rem;" src="./assets/images/id-card.png" alt="id-card-img">
        </div>
        <h2 class="creating-account">ایجاد حساب کاربری</h2>
        <div>
            <form action="" method="get" class="login-form">
                <div class="inputs-container">
                    <input type="text" placeholder="نام و نام خانوادگی">
                    <input class="electronic-post" type="text" placeholder="پست الکترونیک">
                    <div class="password-section">
                        <input type="text" placeholder="رمز عبور">
                        <input type="text" placeholder="تکرار رمز عبور">
                    </div>
                </div>
                <div class="images-container">
                    <img src="./assets/images/user.png" alt="">
                    <img src="./assets/images/mail.png" alt="">
                    <img src="./assets/images/key.png" alt="">
                </div>
            </form>
            <input class="submit-button" type="submit" value="تایید و ثبت نهایی">
        </div>
        <div class="help-buttons">
            <a href="" class="enter">
                <img style="width: 5rem; height: 5rem;" src="./assets/images/enter.png" alt="">
                <p>ورود به حساب</p>
            </a>
            <a href="" class="lock">
                <img style="width: 5rem; height: 5rem;" src="./assets/images/lock.png" alt="">
                <p>فراموشی رمز</p>
            </a>
            <a href="" class="home">
                <img style="width: 5rem; height: 5rem;" src="./assets/images/home.png" alt="">
                <p>خانه</p>
            </a>
        </div>
    </div>
    
</body>
</html>
